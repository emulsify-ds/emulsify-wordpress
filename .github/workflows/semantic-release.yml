name: WordPress Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-state:
    name: Check release publication state
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc

      # Diagnose a partial tag before a stale release draft fails readiness.
      - name: Check published release and ZIP
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/semantic-release.cjs --check-publication

  release-readiness:
    name: Full release readiness
    needs: release-state
    uses: ./.github/workflows/theme-readiness.yml
    with:
      release: true
    permissions:
      contents: read

  semantic-release:
    name: Semantic release
    needs: release-readiness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Clean npm install
        run: npm ci --ignore-scripts

      - name: Download tested release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: emulsify-tested-${{ github.sha }}
          path: dist-artifact
          digest-mismatch: error

      - name: Verify tested archive checksum
        working-directory: dist-artifact
        run: sha256sum --check emulsify.zip.sha256

      # semantic-release verifies push permission even in dry-run mode, so
      # keep this check in the publishing job with its scoped write token.
      - name: Run release dry run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run publish-test -- --no-ci

      - name: Semantic release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run publish
