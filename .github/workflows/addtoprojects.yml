name: Add to projects

on:
  issues:
    types:
      - opened
  pull_request:
    types:
      - opened
  workflow_dispatch:

permissions:
  contents: read

jobs:
  add-to-project:
    name: Add issue to project
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@f2c1f1fa649a891be84948ea89b5dfba1526ef05 # v2.0.1
        with:
          # You can target a repository in a different organization
          # to the issue
          project-url: https://github.com/orgs/emulsify-ds/projects/6
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}
